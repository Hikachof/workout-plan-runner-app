<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="筋トレ">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>筋トレ</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/parts.css">
  <script type="module" src="./assets/js/main.js"></script>
</head>
<body>
  <main id="view" class="view" aria-live="polite"></main>

  <div id="timer-dock" class="timer-dock" hidden></div>

  <nav class="nav" aria-label="画面の切り替え">
    <button class="nav-btn" data-action="go" data-tab="today" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
      <span>今日</span><i class="nav-dot" hidden></i>
    </button>
    <button class="nav-btn" data-action="go" data-tab="log" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg>
      <span>記録</span>
    </button>
    <button class="nav-btn" data-action="go" data-tab="plan" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
      <span>計画</span>
    </button>
    <button class="nav-btn" data-action="go" data-tab="settings" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
      <span>設定</span>
    </button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-action="sheet-close"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true"><div class="sheet-body"></div></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>このアプリは JavaScript を使います。</noscript>
</body>
</html>
